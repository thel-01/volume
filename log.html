<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volume — Log</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Volume">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">

    <!-- Global status: outside every view so a hidden section can't swallow it. -->
    <div id="top-status" class="status" role="status" aria-live="polite" hidden></div>

    <!-- =================== START VIEW (no active session) =================== -->
    <section id="start-view" hidden>
      <div class="page-header">
        <a href="./dashboard.html" class="icon-link" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></a>
        <h1>Start workout</h1>
        <span class="icon-link" style="visibility:hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></span>
      </div>

      <p class="section-label">Session type</p>
      <div id="category-chips" class="chips" style="margin-bottom:var(--space-3);"></div>
      <p id="no-category-types" class="muted" style="margin:calc(-1 * var(--space-1)) 0 var(--space-4);" hidden>
        No session types yet — add some in Settings, or pick Other for now.
      </p>

      <button id="start-btn" type="submit" class="uppercase" disabled>Start workout</button>

      <div id="start-status" class="status" role="status" aria-live="polite" hidden></div>
    </section>

    <!-- =================== SESSION VIEW (logging) =================== -->
    <section id="session-view" hidden>
      <div class="session-bar">
        <div class="session-bar-body">
          <div id="session-category" class="session-bar-category">Workout</div>
          <div id="session-clock" class="session-bar-clock">—</div>
        </div>
        <button id="end-session-btn" class="secondary uppercase" type="button"
                style="width:auto;min-height:var(--tap);padding:0 16px;flex:0 0 auto;">End</button>
      </div>

      <div id="session-exercises"></div>

      <p id="no-exercises" class="empty-state" hidden>
        No exercises yet. Add the first one below.
      </p>

      <button id="add-exercise-btn" type="button" style="margin-top:var(--space-3);">+ Add exercise</button>
    </section>

    <!-- =================== PICKER VIEW (choose / create exercise) =================== -->
    <section id="picker-view" hidden>
      <div class="page-header">
        <button id="picker-back" class="icon-link" type="button" aria-label="Cancel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></button>
        <h1>Add exercise</h1>
        <span class="icon-link" style="visibility:hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></span>
      </div>

      <div class="field">
        <input id="picker-search" type="text" autocomplete="off" autocapitalize="words"
               autocorrect="off" spellcheck="false" placeholder="Search exercises…">
      </div>

      <div id="picker-list"></div>

      <!-- A prompt, not an auto-opened form: typing something new asks
           first rather than dropping you straight into a 3-field form. -->
      <p id="picker-no-match-text" class="muted" hidden style="margin:var(--space-3) 0;"></p>
      <button id="picker-create-toggle" type="button" class="secondary" hidden style="margin-bottom:var(--space-3);"></button>

      <!-- Revealed by the toggle above: create the exercise without leaving
           the workout, per the CLAUDE.md log-screen exception. -->
      <div id="picker-create" hidden>
        <p class="section-label">Create new</p>
        <div class="field">
          <label for="new-ex-name">Name</label>
          <input id="new-ex-name" type="text" autocomplete="off" autocapitalize="words" placeholder="Enter exercise name">
        </div>
        <div class="field">
          <label for="new-ex-type">Type</label>
          <select id="new-ex-type">
            <option value="weight_reps">Standard</option>
            <option value="time_based">Time-based</option>
            <option value="assisted">Assisted</option>
          </select>
        </div>
        <div class="field">
          <label for="new-ex-pattern">Movement pattern (optional)</label>
          <select id="new-ex-pattern">
            <option value="">None — uncategorized</option>
          </select>
        </div>
        <button id="create-exercise-btn" type="button">Create &amp; add</button>
      </div>

      <div id="picker-status" class="status" role="status" aria-live="polite" hidden></div>
    </section>

    <!-- =================== END VIEW (wrap up) =================== -->
    <section id="end-view" hidden>
      <div class="page-header">
        <button id="end-back" class="icon-link" type="button" aria-label="Back to workout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></button>
        <h1>Finish workout</h1>
        <span class="icon-link" style="visibility:hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></span>
      </div>

      <p id="end-summary-heading" class="subtitle"></p>

      <div class="card" style="margin-bottom:var(--space-4);">
        <div id="end-summary"></div>
      </div>

      <button id="session-comment-toggle" type="button" class="link-button" style="margin-bottom:var(--space-4);">+ Add a comment</button>
      <div class="field" id="session-comment-field" hidden>
        <label for="session-comment">How did it go?</label>
        <textarea id="session-comment" placeholder="Add a comment"></textarea>
      </div>

      <div class="btn-row">
        <button id="end-cancel" class="secondary" type="button">Keep going</button>
        <button id="end-confirm" type="button" class="uppercase">Finish</button>
      </div>

      <div id="end-status" class="status" role="status" aria-live="polite" hidden></div>
    </section>

  </main>

  <script type="module">
    import { supabase, requireSession, isAuthError } from './supabase-client.js';
    import { effectiveLoad, effectiveReps, isBodyweightEquivalent } from './strength-index.js';
    import { showToast } from './toast.js';

    const TYPE_LABELS = {
      weight_reps: 'Standard',
      time_based: 'Time-based',
      assisted: 'Assisted',
    };

    // Fixed vocabulary. Stored lowercase; capitalised for display.
    const QUICK_TAGS = [
      { value: 'easy', label: 'Easy' },
      { value: 'hard', label: 'Hard' },
      { value: 'failure', label: 'Failure' },
    ];

    // ------------------------------------------------------------------
    // Element refs
    // ------------------------------------------------------------------
    const startView = document.getElementById('start-view');
    const sessionView = document.getElementById('session-view');
    const pickerView = document.getElementById('picker-view');
    const endView = document.getElementById('end-view');

    const topStatus = document.getElementById('top-status');

    const categoryChips = document.getElementById('category-chips');
    const noCategoryTypes = document.getElementById('no-category-types');
    const startBtn = document.getElementById('start-btn');
    const startStatus = document.getElementById('start-status');

    const sessionCategory = document.getElementById('session-category');
    const sessionClock = document.getElementById('session-clock');
    const endSessionBtn = document.getElementById('end-session-btn');
    const sessionExercisesEl = document.getElementById('session-exercises');
    const noExercises = document.getElementById('no-exercises');
    const addExerciseBtn = document.getElementById('add-exercise-btn');

    const pickerBack = document.getElementById('picker-back');
    const pickerSearch = document.getElementById('picker-search');
    const pickerList = document.getElementById('picker-list');
    const pickerNoMatchText = document.getElementById('picker-no-match-text');
    const pickerCreateToggle = document.getElementById('picker-create-toggle');
    const pickerCreate = document.getElementById('picker-create');
    const newExName = document.getElementById('new-ex-name');
    const newExType = document.getElementById('new-ex-type');
    const newExPattern = document.getElementById('new-ex-pattern');
    const createExerciseBtn = document.getElementById('create-exercise-btn');
    const pickerStatus = document.getElementById('picker-status');

    const endBack = document.getElementById('end-back');
    const endSummaryHeading = document.getElementById('end-summary-heading');
    const endSummary = document.getElementById('end-summary');
    const sessionCommentToggle = document.getElementById('session-comment-toggle');
    const sessionCommentField = document.getElementById('session-comment-field');
    const sessionCommentInput = document.getElementById('session-comment');
    const endCancel = document.getElementById('end-cancel');
    const endConfirm = document.getElementById('end-confirm');
    const endStatus = document.getElementById('end-status');

    // ------------------------------------------------------------------
    // State
    // ------------------------------------------------------------------
    let user = null;
    let session = null;          // the active sessions row, or null
    let allExercises = [];       // live exercises, for the picker
    let allPatterns = [];        // live movement patterns, for inline create
    let patternsById = new Map();
    let sessionTypeNames = [];   // your Settings-managed session_types, by name
    let lastCategoryExercises = []; // exercises logged last time this session's category ran

    // One entry per exercise in this session, in the order they were added.
    // { exercise, sessionExerciseId, comment, sets[], history, expanded, stickyWeight }
    let entries = [];

    let clockTimer = null;
    let restGaugeTimer = null;
    let latestBodyweightKg = null;
    let bodyweightLoaded = false;
    let selectedCategory = null;
    // The dismiss() for a still-live "Workout ended… Undo" toast from a stale
    // auto-close — disarmed the instant a new session starts, so a later tap
    // can't yank the user out of the new one and back into the stale old one.
    let staleUndoDismiss = null;

    // ------------------------------------------------------------------
    // Small shared helpers (same shape as exercises.html)
    // ------------------------------------------------------------------
    // Same two icons used for every success/error status across the app —
    // color-only otherwise, which doesn't hold up for anyone who can't rely
    // on color alone.
    const STATUS_ICONS = {
      ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13 L10 19 L20 5"/></svg>',
      error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L22 20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="0.9" fill="var(--danger)" stroke="none"/></svg>',
    };
    function show(el, kind, message) {
      el.className = `status ${kind}`;
      el.innerHTML = STATUS_ICONS[kind] || '';
      el.appendChild(document.createTextNode(message));
      el.hidden = false;
    }
    function hide(el) {
      el.hidden = true;
      el.innerHTML = '';
    }
    // Floats above the page instead of pushing it down — show()/hide() above
    // stay as-is for the load-time #top-status error, a different, blocking
    // case that isn't this.
    function flash(message, kind = 'ok', ms = 3000) {
      showToast(message, kind, { ms });
    }
    /** Ending a workout leaves this page entirely — the dashboard shows the message instead. */
    function goToDashboardWithFlash(message, kind = 'ok') {
      sessionStorage.setItem('volume:flash', JSON.stringify({ kind, message }));
      window.location.href = './dashboard.html';
    }
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    /** mm:ss, for a ticking elapsed-time gauge. */
    function formatElapsed(totalSeconds) {
      const s = Math.max(0, totalSeconds);
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }
    /** Compact elapsed time for a workout already under way: "23m", "1h 40m". */
    function elapsedSince(iso) {
      const mins = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
      if (mins < 60) return `${mins}m`;
      const rest = mins % 60;
      return rest === 0 ? `${Math.floor(mins / 60)}h` : `${Math.floor(mins / 60)}h ${rest}m`;
    }
    function showView(view) {
      startView.hidden = view !== 'start';
      sessionView.hidden = view !== 'session';
      pickerView.hidden = view !== 'picker';
      endView.hidden = view !== 'end';
    }

    // Trims trailing zeros so 30.00 reads as "30" but 32.50 reads as "32.5".
    function formatWeight(value) {
      if (value === null || value === undefined) return '';
      const n = Number(value);
      return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(2)));
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '';
      const s = Number(seconds);
      if (s < 60) return `${s}s`;
      const mins = Math.floor(s / 60);
      const rest = s % 60;
      return rest === 0 ? `${mins}m` : `${mins}m ${rest}s`;
    }

    /** "30 kg × 12" / "45s" / "20 kg assist × 10" / "+10 kg × 8" — one set, for display. */
    function describeSet(set, type) {
      if (type === 'time_based') return formatDuration(set.duration_seconds);
      // Zero assistance on a legacy 'assisted' exercise isn't assisted at
      // all — it's a plain bodyweight rep, so it reads as one.
      if (isBodyweightEquivalent(set, type)) return describeBodyweightSet(set);
      const weight = set.weight === null ? null : `${formatWeight(set.weight)} kg`;
      const suffix = type === 'assisted' ? ' assist' : '';
      const parts = [];
      if (weight) parts.push(weight + suffix);
      if (set.reps !== null && set.reps !== undefined) parts.push(`× ${set.reps}`);
      return parts.join(' ') || '—';
    }

    /** "BW × 12" / "+10 kg × 8" / "−15 kg × 6". Real numbers, never the effective-load estimate. */
    function describeBodyweightSet(set) {
      const magnitude = Number(set.weight || 0);
      let prefix;
      if (magnitude === 0) prefix = 'BW';
      else if (set.weight_direction === 'assist') prefix = `−${formatWeight(magnitude)} kg`;
      else prefix = `+${formatWeight(magnitude)} kg`;
      const reps = set.reps !== null && set.reps !== undefined ? ` × ${set.reps}` : '';
      return prefix + reps;
    }

    // Single-letter shorthand for a set's quick tag, e.g. "14f" = 14 reps to failure.
    function tagLetter(quickTag) {
      if (quickTag === 'easy') return 'e';
      if (quickTag === 'hard') return 'h';
      if (quickTag === 'failure') return 'f';
      return '';
    }

    /**
     * "30 kg × 12h, 12, 9f" — collapses a run of sets that share a weight so the
     * reference lines stay readable at a glance mid-workout. Each rep number
     * carries its quick-tag letter directly, so effort is visible without
     * expanding anything.
     */
    function describeSetGroup(sets, type) {
      if (sets.length === 0) return '';
      if (type === 'time_based') {
        return sets.map((s) => formatDuration(s.duration_seconds) + tagLetter(s.quick_tag)).join(', ');
      }
      const chunks = [];
      let current = null;
      for (const set of sets) {
        const bwEquiv = isBodyweightEquivalent(set, type);
        // Bodyweight (and bodyweight-equivalent) groups on direction too —
        // same magnitude assisted vs. added is a different effective load,
        // not the same set repeated. Everything else groups on weight alone.
        const key = bwEquiv
          ? `bw:${set.weight_direction ?? ''}:${formatWeight(set.weight ?? 0)}`
          : (set.weight === null ? 'none' : formatWeight(set.weight));
        if (!current || current.key !== key) {
          current = { key, bwEquiv, weight: set.weight, weightDirection: set.weight_direction, reps: [] };
          chunks.push(current);
        }
        current.reps.push(`${set.reps ?? '—'}${tagLetter(set.quick_tag)}`);
      }
      const suffix = type === 'assisted' ? ' assist' : '';
      return chunks
        .map((c) => {
          if (c.bwEquiv) {
            const prefix = describeBodyweightSet({ weight: c.weight, weight_direction: c.weightDirection, reps: null });
            return `${prefix} × ${c.reps.join(', ')}`;
          }
          const w = c.weight === null ? '' : `${formatWeight(c.weight)} kg${suffix} `;
          return `${w}× ${c.reps.join(', ')}`;
        })
        .join(' | ');
    }

    // ------------------------------------------------------------------
    // 📌 PIN — provisional "best session" rule.
    //
    // Currently: the single heaviest session for this exercise, showing all of
    // its sets. Scored by the best single set, using each type's own idea of
    // "best" (assisted inverts — less assistance is better).
    //
    // When two sessions tie on weight, reps break the tie: compare rep counts
    // set-by-set in the order performed, and the first set where one session
    // did more reps wins the whole comparison — even if a later set favoured
    // the other session. First set carries the most weight because it's the
    // freshest, most comparable effort; a stronger fourth set on a lighter
    // day says less. This also automatically covers outright domination (more
    // reps at every set), since a dominant session's first difference can
    // only ever run in its own favour. Only recency breaks a genuine tie
    // (identical rep sequences). Each set's reps run through effectiveReps()
    // first, so a failed last rep doesn't count toward the comparison.
    //
    // This is deliberately simple and NOT the CLAUDE.md PR definition, which
    // describes a frontier rather than one winner. When that rule gets pinned
    // down properly, this function is the only place that needs to change.
    // ------------------------------------------------------------------
    function findBestSession(history, type) {
      if (!history || history.length === 0) return null;

      const bySession = new Map();
      for (const set of history) {
        const sid = set.session_id;
        if (!bySession.has(sid)) {
          bySession.set(sid, { sessionId: sid, startTime: set.sessions?.start_time, sets: [] });
        }
        bySession.get(sid).sets.push(set);
      }

      // Chronological within each session up front — both the score and the
      // reps tiebreak depend on "the order the sets were actually performed".
      for (const group of bySession.values()) {
        group.sets.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      }

      const scoreOf = (sets) => {
        if (type === 'time_based') {
          return Math.max(...sets.map((s) => s.duration_seconds ?? -Infinity));
        }
        if (type === 'bodyweight') {
          const loads = sets.map((s) => effectiveLoad(s, type)).filter((w) => w !== null);
          return loads.length === 0 ? null : Math.max(...loads);
        }
        const weights = sets.map((s) => (s.weight === null ? null : Number(s.weight)))
                            .filter((w) => w !== null);
        if (weights.length === 0) return null;
        // assisted: lower is better, so negate to keep "bigger score wins".
        return type === 'assisted' ? -Math.min(...weights) : Math.max(...weights);
      };

      // Positive -> `a` wins, negative -> `b` wins, zero -> genuinely tied.
      // Each set's reps run through effectiveReps() first — a failed last rep
      // wasn't actually completed, so it can't out-tiebreak a clean set.
      const repsTiebreak = (a, b) => {
        const len = Math.min(a.length, b.length);
        for (let i = 0; i < len; i++) {
          const ar = a[i].reps === null ? -Infinity : effectiveReps(a[i].reps, a[i].quick_tag);
          const br = b[i].reps === null ? -Infinity : effectiveReps(b[i].reps, b[i].quick_tag);
          const diff = ar - br;
          if (diff !== 0) return diff;
        }
        return a.length - b.length; // more sets performed edges out a shorter session
      };

      let best = null;
      for (const group of bySession.values()) {
        const score = scoreOf(group.sets);
        if (score === null || !Number.isFinite(score)) continue;

        if (!best) { best = { ...group, score }; continue; }
        if (score > best.score) { best = { ...group, score }; continue; }
        if (score < best.score) continue;

        // Tied on weight/duration.
        const newer = group.startTime && best.startTime && new Date(group.startTime) > new Date(best.startTime);
        if (type === 'time_based') {
          if (newer) best = { ...group, score };
          continue;
        }
        const advantage = repsTiebreak(group.sets, best.sets);
        if (advantage > 0 || (advantage === 0 && newer)) {
          best = { ...group, score };
        }
      }

      return best;
    }

    /** Most recent session for this exercise, excluding the one in progress. */
    function findLastSession(history, currentSessionId) {
      if (!history || history.length === 0) return null;

      const bySession = new Map();
      for (const set of history) {
        if (set.session_id === currentSessionId) continue;
        const sid = set.session_id;
        if (!bySession.has(sid)) {
          bySession.set(sid, { sessionId: sid, startTime: set.sessions?.start_time, sets: [] });
        }
        bySession.get(sid).sets.push(set);
      }

      let latest = null;
      for (const group of bySession.values()) {
        if (!latest || new Date(group.startTime) > new Date(latest.startTime)) latest = group;
      }
      if (!latest) return null;
      latest.sets = [...latest.sets].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      return latest;
    }

    /**
     * The weight to prefill. Sets logged in this session win (set 2 assumes
     * set 1's weight); otherwise fall back to the last weight you actually
     * used the previous time you did this movement.
     *
     * Deliberately ordered by when the *workout happened* (via findLastSession)
     * rather than by row creation time, so a session logged out of order can't
     * hand back a weight from the wrong day.
     *
     * Reps are never carried — they're the thing being tracked.
     */
    function pickStickyWeight(entry, currentSessionId) {
      const lastWeightIn = (sets) => {
        for (let i = sets.length - 1; i >= 0; i--) {
          const w = sets[i].weight;
          if (w !== null && w !== undefined) return formatWeight(w);
        }
        return null;
      };

      if (entry.sets.length > 0) {
        const fromThisSession = lastWeightIn(entry.sets);
        if (fromThisSession !== null) return fromThisSession;
      }

      const previous = findLastSession(entry.history, currentSessionId);
      if (previous) {
        const fromLastTime = lastWeightIn(previous.sets);
        if (fromLastTime !== null) return fromLastTime;
      }
      return '';
    }

    /**
     * The assist/bodyweight/add-weight mode to prefill, same cascade as
     * pickStickyWeight — this session's own sets first, then last time you
     * did this movement — falling back to plain bodyweight if there's no
     * history at all yet.
     */
    function pickStickyBodyweightMode(entry, currentSessionId) {
      const lastModeIn = (sets) => {
        for (let i = sets.length - 1; i >= 0; i--) {
          const s = sets[i];
          if (s.weight !== null && s.weight !== undefined) {
            return { direction: s.weight_direction ?? 'add', magnitude: formatWeight(s.weight) };
          }
        }
        return null;
      };

      if (entry.sets.length > 0) {
        const fromThisSession = lastModeIn(entry.sets);
        if (fromThisSession !== null) return fromThisSession;
      }

      const previous = findLastSession(entry.history, currentSessionId);
      if (previous) {
        const fromLastTime = lastModeIn(previous.sets);
        if (fromLastTime !== null) return fromLastTime;
      }
      return { direction: 'add', magnitude: '0' };
    }

    // ------------------------------------------------------------------
    // Warm-up ladder
    // ------------------------------------------------------------------
    /**
     * How coarsely to round a warm-up weight, scaled to what you're lifting.
     * 5kg jumps are right for a squat and absurd for a curl, so the step grows
     * with the working weight rather than being one fixed number.
     */
    function warmupStep(weight) {
      if (weight < 10) return 0.5;
      if (weight < 20) return 1;
      if (weight < 60) return 2.5;
      return 5;
    }

    /**
     * 50 / 75 / 90% of the weight you actually worked up to last time.
     *
     * Averaged over your last two sessions, so one bad day doesn't drag the
     * whole ladder down with it.
     *
     * Weight × reps only. On an assisted machine the number recorded is how
     * much help the machine gave, so a "lighter" warm-up would mean *less*
     * assistance — harder, not easier. And a time-based hold has no weight to
     * scale in the first place.
     */
    function computeWarmup(entry, currentSessionId) {
      if (entry.exercise.type !== 'weight_reps') return null;

      // Heaviest weight touched in each past session.
      const bySession = new Map();
      for (const set of entry.history || []) {
        if (set.session_id === currentSessionId) continue;
        const w = Number(set.weight);
        if (!(w > 0)) continue;
        const seen = bySession.get(set.session_id);
        if (!seen) {
          bySession.set(set.session_id, { start: set.sessions?.start_time, top: w });
        } else if (w > seen.top) {
          seen.top = w;
        }
      }

      const recent = [...bySession.values()]
        .sort((a, b) => new Date(b.start) - new Date(a.start))
        .slice(0, 2);
      if (recent.length === 0) return null;

      const target = recent.reduce((sum, s) => sum + s.top, 0) / recent.length;
      const step = warmupStep(target);

      const ladder = [];
      for (const pct of [0.5, 0.75, 0.9]) {
        const w = parseFloat((Math.round((target * pct) / step) * step).toFixed(2));
        // Never suggest a "warm-up" at or above the working weight, and skip a
        // rung that rounded onto the one below it.
        if (w > 0 && w < target && !ladder.includes(w)) ladder.push(w);
      }
      return ladder.length > 0 ? ladder : null;
    }

    // ------------------------------------------------------------------
    // Error messages
    // ------------------------------------------------------------------
    function describeSetError(error) {
      if (error.message?.includes('sets_reps_sane')) return 'Reps must be a whole number above 0.';
      if (error.message?.includes('sets_duration_sane')) return 'Duration must be above 0 seconds.';
      if (error.message?.includes('sets_weight_sane')) return "Weight can't be negative.";
      if (error.message?.includes('sets_not_empty')) return 'Enter at least a weight, reps, or a duration.';
      if (error.message === 'Failed to fetch') return "Couldn't reach the server — check your signal and tap again.";
      return `Could not save the set: ${error.message}`;
    }
    function describeExerciseCreateError(error, name) {
      if (error.code === '23505') return `You already have an exercise named "${name}". Search for it instead.`;
      if (error.message?.includes('exercises_name_not_blank')) return "Name can't be blank.";
      return `Could not create the exercise: ${error.message}`;
    }

    // ------------------------------------------------------------------
    // Start view
    //
    // Chips come from Settings' managed session_types list, plus "Other" —
    // always last, never stored as a row, always available even with an
    // empty list so a fresh account isn't blocked from logging anything.
    // Picking one is required: no more free-typed categories that could
    // drift into a different casing from everything before them.
    // ------------------------------------------------------------------
    const OTHER_CATEGORY = 'Other';

    function renderCategoryChips() {
      categoryChips.innerHTML = '';
      noCategoryTypes.hidden = sessionTypeNames.length > 0;
      const options = [...sessionTypeNames, OTHER_CATEGORY];
      for (const cat of options) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (selectedCategory === cat ? ' selected' : '');
        chip.textContent = cat;
        chip.addEventListener('click', () => {
          selectedCategory = cat;
          renderCategoryChips();
          startBtn.disabled = !selectedCategory;
        });
        categoryChips.appendChild(chip);
      }
    }

    startBtn.addEventListener('click', async () => {
      staleUndoDismiss?.();
      staleUndoDismiss = null;
      hide(startStatus);
      const category = selectedCategory;

      startBtn.disabled = true;
      startBtn.textContent = 'Starting…';

      const { data, error } = await supabase
        .from('sessions')
        .insert({ user_id: user.id, category })
        .select()
        .single();

      startBtn.disabled = false;
      startBtn.textContent = 'Start workout';

      if (error) {
        show(startStatus, 'error', `Could not start the workout: ${error.message}`);
        return;
      }

      session = data;
      entries = [];
      lastCategoryExercises = await loadLastCategoryExercises(session.category);
      enterSession();
    });

    /**
     * What you logged the last time you did this same session type (Push,
     * Pull, ...), so the picker can offer it before you've typed anything.
     * Only completed sessions count, and never the one in progress.
     */
    async function loadLastCategoryExercises(category) {
      if (!category) return [];

      const { data: lastSession, error } = await supabase
        .from('sessions')
        .select('id')
        .is('deleted_at', null)
        .not('end_time', 'is', null)
        .ilike('category', category)
        .neq('id', session.id)
        .order('start_time', { ascending: false })
        .limit(1)
        .maybeSingle();
      if (error || !lastSession) return [];

      const { data: rows, error: seError } = await supabase
        .from('session_exercises')
        .select('exercise_id, created_at, exercises(*)')
        .eq('session_id', lastSession.id)
        .order('created_at');
      if (seError) return [];

      return rows
        .filter((r) => r.exercises && !r.exercises.deleted_at)
        .map((r) => r.exercises);
    }

    // ------------------------------------------------------------------
    // Session view
    // ------------------------------------------------------------------
    function enterSession() {
      sessionCategory.textContent = session.category || 'Workout';
      startClock();
      renderEntries();
      showView('session');
      loadLatestBodyweight();
    }

    /** Fetched once per session — cached, not re-queried per bodyweight exercise. */
    async function loadLatestBodyweight() {
      const { data, error } = await supabase
        .from('body_weights')
        .select('weight_kg')
        .order('measured_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      bodyweightLoaded = true;
      latestBodyweightKg = error || !data ? null : Number(data.weight_kg);
      if (session) renderEntries();
    }

    function startClock() {
      const tick = () => {
        const ms = Date.now() - new Date(session.start_time).getTime();
        const mins = Math.floor(ms / 60000);
        const hrs = Math.floor(mins / 60);
        const started = new Date(session.start_time)
          .toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        const elapsed = hrs > 0 ? `${hrs}h ${mins % 60}m` : `${mins}m`;
        sessionClock.textContent = `Started ${started} · ${elapsed}`;
      };
      tick();
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(tick, 30000);
    }

    function renderEntries() {
      sessionExercisesEl.innerHTML = '';
      noExercises.hidden = entries.length !== 0;
      for (const entry of entries) {
        sessionExercisesEl.appendChild(buildExerciseCard(entry));
      }
      startRestGauge();
    }

    /** Ticks the expanded card's "time since last set" line, if it has one. */
    function startRestGauge() {
      if (restGaugeTimer) { clearInterval(restGaugeTimer); restGaugeTimer = null; }
      const gaugeEl = document.getElementById('rest-gauge');
      const expandedEntry = entries.find((e) => e.expanded);
      if (!gaugeEl || !expandedEntry || expandedEntry.sets.length === 0) return;

      const lastSet = expandedEntry.sets[expandedEntry.sets.length - 1];
      const lastSetMs = new Date(lastSet.created_at).getTime();
      const tick = () => {
        const secs = Math.floor((Date.now() - lastSetMs) / 1000);
        gaugeEl.textContent = `${formatElapsed(secs)} since last set`;
      };
      tick();
      restGaugeTimer = setInterval(tick, 1000);
    }

    function buildExerciseCard(entry) {
      const card = document.createElement('div');
      card.className = 'exercise-card' + (entry.expanded ? ' expanded' : '');

      // --- header (always visible, toggles the accordion) ---
      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'exercise-card-header';

      const headerBody = document.createElement('div');
      headerBody.className = 'list-item-body';
      const name = document.createElement('div');
      name.className = 'list-item-name';
      name.textContent = entry.exercise.name;
      headerBody.appendChild(name);

      const meta = document.createElement('div');
      meta.className = 'list-item-meta';
      const setCount = document.createElement('span');
      setCount.textContent = entry.sets.length === 1 ? '1 set' : `${entry.sets.length} sets`;
      meta.appendChild(setCount);
      if (entry.sets.length > 0) {
        const summary = document.createElement('span');
        summary.className = 'badge';
        summary.textContent = describeSetGroup(entry.sets, entry.exercise.type);
        meta.appendChild(summary);
      }
      if (entry.isExtra) {
        const extraBadge = document.createElement('span');
        extraBadge.className = 'badge';
        extraBadge.textContent = 'Extra';
        meta.appendChild(extraBadge);
      }
      headerBody.appendChild(meta);
      header.appendChild(headerBody);

      // Accordion indicator, not a disclosure arrow — one V-shaped chevron
      // that rotates 180° open, rather than swapping between two glyphs.
      const chevron = document.createElement('span');
      chevron.className = 'list-item-chevron';
      chevron.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform var(--motion-fast);"><path d="M5 8 L12 15 L19 8"/></svg>';
      if (entry.expanded) chevron.firstElementChild.style.transform = 'rotate(180deg)';
      header.appendChild(chevron);

      header.addEventListener('click', () => {
        const wasExpanded = entry.expanded;
        for (const e of entries) e.expanded = false;   // accordion: one at a time
        entry.expanded = !wasExpanded;
        renderEntries();
      });
      card.appendChild(header);

      if (!entry.expanded) return card;

      // --- body ---
      const body = document.createElement('div');
      body.className = 'exercise-card-body';

      // Setup info you set once in the exercise library ("ROM -3", "rack
      // hooks 26") — worth seeing before you touch the weights, so it comes
      // first and is never hidden behind a tap.
      if (entry.exercise.persistent_notes) {
        const notesLine = document.createElement('div');
        notesLine.className = 'reference-line';
        const notesLabel = document.createElement('span');
        notesLabel.className = 'reference-label';
        notesLabel.textContent = 'Notes:';
        notesLine.appendChild(notesLabel);
        const notesValue = document.createElement('span');
        notesValue.className = 'reference-value';
        notesValue.textContent = entry.exercise.persistent_notes;
        notesLine.appendChild(notesValue);
        body.appendChild(notesLine);
      }

      const lastGroup = findLastSession(entry.history, session.id);
      const bestGroup = findBestSession(entry.history, entry.exercise.type);
      // Same session for both, or neither exists yet (genuinely the first
      // time) — one block instead of two saying the same thing.
      const sameOrBothEmpty = (lastGroup && bestGroup && lastGroup.sessionId === bestGroup.sessionId)
        || (!lastGroup && !bestGroup);
      if (sameOrBothEmpty) {
        body.appendChild(buildReferenceBlock('Last and best', entry, lastGroup, 'first time doing this'));
      } else {
        body.appendChild(buildReferenceBlock('Last', entry, lastGroup, 'first time doing this'));
        body.appendChild(buildReferenceBlock('Best', entry, bestGroup, 'none yet'));
      }

      // Only worth showing before you've started — once set 1 is in, you're
      // warm and it's just clutter.
      if (entry.sets.length === 0) {
        const ladder = computeWarmup(entry, session.id);
        if (ladder) {
          const line = document.createElement('div');
          line.className = 'reference-line';
          const label = document.createElement('span');
          label.className = 'reference-label';
          label.textContent = 'Warm-up:';
          line.appendChild(label);
          const value = document.createElement('span');
          value.className = 'reference-value';
          value.textContent = `${ladder.map(formatWeight).join(' | ')} kg`;
          line.appendChild(value);
          body.appendChild(line);
        }
      }


      // Exercise comment for this specific day — collapsed unless it's
      // already got something in it, same reveal pattern as "+ Add note".
      // "Extra" lives in the same row as the note now rather than its own
      // always-visible section — both are occasional, this-instance-only
      // metadata, so one disclosure covers both instead of two competing
      // for space at the top of the card.
      const commentToggle = document.createElement('button');
      commentToggle.type = 'button';
      commentToggle.className = 'link-button';
      commentToggle.style.display = 'block';
      commentToggle.style.marginTop = 'var(--space-3)';
      commentToggle.textContent = entry.commentExpanded ? '− Hide note' : '+ Add note for today';
      body.appendChild(commentToggle);

      const commentField = document.createElement('div');
      commentField.style.marginTop = 'var(--space-3)';
      commentField.hidden = !entry.commentExpanded;

      const commentRow = document.createElement('div');
      commentRow.style.cssText = 'display:flex;gap:var(--space-3);align-items:flex-start;';
      const textareaWrap = document.createElement('div');
      textareaWrap.className = 'field';
      textareaWrap.style.cssText = 'flex:1;min-width:0;margin-bottom:0;';
      const comment = document.createElement('textarea');
      comment.id = `comment-${entry.exercise.id}`;
      comment.value = entry.comment || '';
      comment.placeholder = 'Add a note for today';
      comment.rows = 1;
      comment.style.cssText = 'height:56px;min-height:56px;';
      textareaWrap.appendChild(comment);
      commentRow.appendChild(textareaWrap);

      const extraChip = document.createElement('button');
      extraChip.type = 'button';
      extraChip.className = 'chip' + (entry.isExtra ? ' selected' : '');
      extraChip.style.flex = '0 0 auto';
      extraChip.textContent = 'Extra';
      extraChip.addEventListener('click', () => toggleExtra(entry));
      commentRow.appendChild(extraChip);
      commentField.appendChild(commentRow);

      // Only worth the explanation once it's actually on.
      if (entry.isExtra) {
        const extraNote = document.createElement('p');
        extraNote.className = 'muted';
        extraNote.style.cssText = 'margin:6px 0 0;font-size:13px;';
        extraNote.textContent = "Not today's focus — still counts toward the strength index, just shown as its own slice in the volume chart instead of this session's category.";
        commentField.appendChild(extraNote);
      }

      const commentState = document.createElement('p');
      commentState.className = 'muted';
      commentState.style.cssText = 'margin:var(--space-1) 0 0;min-height:18px;font-size:13px;';
      commentField.appendChild(commentState);
      wireCommentAutosave(entry, comment, commentState);
      body.appendChild(commentField);

      commentToggle.addEventListener('click', () => {
        entry.commentExpanded = commentField.hidden;
        commentField.hidden = !commentField.hidden;
        commentToggle.textContent = commentField.hidden ? '+ Add note for today' : '− Hide note';
        if (!commentField.hidden) comment.focus();
      });

      // Sets logged so far this session.
      if (entry.sets.length > 0) {
        // Not a rest countdown — just how long it's been since the last set
        // in this exercise, as a live gauge you can glance at while resting.
        const gauge = document.createElement('p');
        gauge.id = 'rest-gauge';
        gauge.className = 'muted';
        body.appendChild(gauge);

        const label = document.createElement('p');
        label.className = 'section-label';
        label.textContent = 'This session';
        body.appendChild(label);
        for (let i = 0; i < entry.sets.length; i++) {
          body.appendChild(buildSetRow(entry, entry.sets[i], i));
        }
      }

      body.appendChild(buildEntryBlock(entry));
      card.appendChild(body);
      return card;
    }

    async function toggleExtra(entry) {
      const next = !entry.isExtra;
      entry.isExtra = next;
      renderEntries();
      const { error } = await supabase.from('session_exercises').update({ is_extra: next }).eq('id', entry.sessionExerciseId);
      if (error) {
        entry.isExtra = !next;
        renderEntries();
        flash(`Could not update: ${error.message}`, 'error');
      }
    }

    async function removeEmptyExercise(entry) {
      const { error } = await supabase.from('session_exercises').delete().eq('id', entry.sessionExerciseId);
      if (error) {
        flash(`Could not remove ${entry.exercise.name}: ${error.message}`, 'error');
        return;
      }
      entries = entries.filter((e) => e !== entry);
      renderEntries();
    }

    /**
     * "Last" / "Best" (or "Last and best") as two rows: a header line with
     * the date as a trailing badge, then the actual sets underneath — was
     * one long "12 Aug — 30 kg × 12, 12, 7" line, which read as a wall of
     * text next to everything else on the card.
     */
    function buildReferenceBlock(labelText, entry, group, emptyText) {
      const container = document.createElement('div');
      container.style.marginBottom = 'var(--space-3)';

      const header = document.createElement('div');
      header.className = 'reference-line';
      const label = document.createElement('span');
      label.className = 'reference-label';
      label.textContent = labelText;
      header.appendChild(label);

      if (group) {
        const dateBadge = document.createElement('span');
        dateBadge.className = 'badge';
        dateBadge.textContent = group.startTime ? formatDate(group.startTime) : '';
        header.appendChild(dateBadge);
      } else {
        const none = document.createElement('span');
        none.className = 'reference-value none';
        none.textContent = emptyText;
        header.appendChild(none);
      }
      container.appendChild(header);

      if (group) {
        const value = document.createElement('div');
        value.className = 'reference-value';
        value.style.marginTop = '2px';
        value.textContent = describeSetGroup(group.sets, entry.exercise.type);
        container.appendChild(value);
      }

      return container;
    }

    function buildSetRow(entry, set, index) {
      const row = document.createElement('div');
      row.className = 'set-row';

      const idx = document.createElement('span');
      idx.className = 'set-index';
      idx.textContent = String(index + 1);
      row.appendChild(idx);

      const detailWrap = document.createElement('div');
      detailWrap.className = 'set-detail';
      const detail = document.createElement('div');
      detail.textContent = describeSet(set, entry.exercise.type);
      detailWrap.appendChild(detail);
      row.appendChild(detailWrap);

      if (set.quick_tag) {
        const tag = document.createElement('span');
        tag.className = 'badge';
        const found = QUICK_TAGS.find((t) => t.value === set.quick_tag);
        tag.textContent = found ? found.label : set.quick_tag;
        row.appendChild(tag);
      }

      // Two-tap delete: × turns into "Delete?" rather than a browser dialog.
      const DELETE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>';
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'set-delete';
      del.innerHTML = DELETE_ICON;
      del.setAttribute('aria-label', 'Delete set');
      let armed = false;
      let disarmTimer = null;
      del.addEventListener('click', async () => {
        if (!armed) {
          armed = true;
          del.classList.add('confirming');
          del.textContent = 'Delete?';
          disarmTimer = setTimeout(() => {
            armed = false;
            del.classList.remove('confirming');
            del.innerHTML = DELETE_ICON;
          }, 3000);
          return;
        }
        clearTimeout(disarmTimer);
        del.disabled = true;
        del.textContent = '…';
        const { error } = await supabase.from('sets').delete().eq('id', set.id);
        if (error) {
          del.disabled = false;
          del.classList.remove('confirming');
          del.innerHTML = DELETE_ICON;
          armed = false;
          flash(`Could not delete the set: ${error.message}`, 'error', 5000);
          return;
        }
        entry.sets = entry.sets.filter((s) => s.id !== set.id);
        entry.history = entry.history.filter((s) => s.id !== set.id);
        renderEntries();
        flash('Set deleted.');
      });
      row.appendChild(del);

      return row;
    }

    function buildEntryBlock(entry) {
      const type = entry.exercise.type;

      // Bodyweight logging needs a known bodyweight to snapshot — if none
      // exists yet, offer a quick way to log one instead of failing silently
      // at submit time. Nothing else in this card is useful until resolved.
      if (type === 'bodyweight' && bodyweightLoaded && latestBodyweightKg === null) {
        return buildBodyweightNudgeBlock(entry);
      }

      const block = document.createElement('div');
      block.className = 'entry-block';

      const fieldRow = document.createElement('div');
      fieldRow.className = 'field-row';

      let weightInput = null;
      let repsInput = null;
      let durationInput = null;
      let bwMode = null; // { getDirection, magnitudeInput } — 'bodyweight' type only

      if (type === 'time_based') {
        const f = document.createElement('div');
        f.className = 'field';
        const l = document.createElement('label');
        l.textContent = 'Duration (seconds)';
        l.htmlFor = `dur-${entry.exercise.id}`;
        f.appendChild(l);
        durationInput = document.createElement('input');
        durationInput.id = `dur-${entry.exercise.id}`;
        durationInput.type = 'text';
        durationInput.inputMode = 'numeric';
        durationInput.autocomplete = 'off';
        f.appendChild(durationInput);
        fieldRow.appendChild(f);
      } else if (type === 'bodyweight') {
        const modeChips = document.createElement('div');
        modeChips.className = 'chips';
        modeChips.style.marginBottom = 'var(--space-3)';
        block.appendChild(modeChips);

        const magField = document.createElement('div');
        magField.className = 'field';
        const magLabel = document.createElement('label');
        magField.appendChild(magLabel);
        const magInput = document.createElement('input');
        magInput.type = 'text';
        magInput.inputMode = 'decimal';
        magInput.autocomplete = 'off';
        magField.append(magLabel, magInput);
        fieldRow.appendChild(magField);

        const sticky = pickStickyBodyweightMode(entry, session.id);
        let direction = Number(sticky.magnitude || 0) === 0 ? 'none' : sticky.direction;

        const MODES = [
          { value: 'assist', label: 'Assist' },
          { value: 'none', label: 'BW' },
          { value: 'add', label: 'Weight' },
        ];
        const modeButtons = new Map();
        const updateModeUI = () => {
          for (const [value, btn] of modeButtons) btn.classList.toggle('selected', value === direction);
          magField.hidden = direction === 'none';
          magLabel.textContent = direction === 'assist' ? 'Assistance (kg)' : 'Added weight (kg)';
        };
        for (const m of MODES) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = m.label;
          chip.addEventListener('click', () => { direction = m.value; updateModeUI(); });
          modeChips.appendChild(chip);
          modeButtons.set(m.value, chip);
        }
        magInput.value = direction === 'none' ? '' : sticky.magnitude;
        updateModeUI();
        bwMode = { getDirection: () => direction, magnitudeInput: magInput };

        const rf = document.createElement('div');
        rf.className = 'field';
        const rl = document.createElement('label');
        rl.textContent = 'Reps';
        rl.htmlFor = `r-${entry.exercise.id}`;
        rf.appendChild(rl);
        repsInput = document.createElement('input');
        repsInput.id = `r-${entry.exercise.id}`;
        repsInput.type = 'text';
        repsInput.inputMode = 'numeric';
        repsInput.autocomplete = 'off';
        rf.appendChild(repsInput);
        fieldRow.appendChild(rf);
      } else {
        const wf = document.createElement('div');
        wf.className = 'field';
        const wl = document.createElement('label');
        wl.textContent = type === 'assisted' ? 'Assistance (kg)' : 'Weight (kg)';
        wl.htmlFor = `w-${entry.exercise.id}`;
        wf.appendChild(wl);
        weightInput = document.createElement('input');
        weightInput.id = `w-${entry.exercise.id}`;
        weightInput.type = 'text';
        weightInput.inputMode = 'decimal';
        weightInput.autocomplete = 'off';
        // Sticky: carried from the last set, or from last time you did this.
        weightInput.value = pickStickyWeight(entry, session.id);
        wf.appendChild(weightInput);
        fieldRow.appendChild(wf);

        const rf = document.createElement('div');
        rf.className = 'field';
        const rl = document.createElement('label');
        rl.textContent = 'Reps';
        rl.htmlFor = `r-${entry.exercise.id}`;
        rf.appendChild(rl);
        repsInput = document.createElement('input');
        repsInput.id = `r-${entry.exercise.id}`;
        repsInput.type = 'text';
        repsInput.inputMode = 'numeric';
        repsInput.autocomplete = 'off';
        // Always empty — reps are the tracked signal, never assumed.
        rf.appendChild(repsInput);
        fieldRow.appendChild(rf);
      }
      block.appendChild(fieldRow);

      // Quick tags — single select, tap again to clear.
      let activeTag = null;
      let activeSide = null;
      const chips = document.createElement('div');
      chips.className = 'chips';
      chips.style.marginTop = 'var(--space-3)';
      for (const tag of QUICK_TAGS) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = tag.label;
        chip.addEventListener('click', () => {
          activeTag = activeTag === tag.value ? null : tag.value;
          for (const c of chips.children) c.classList.remove('selected');
          if (activeTag) chip.classList.add('selected');
          updateSideVisibility();
        });
        chips.appendChild(chip);
      }
      block.appendChild(chips);

      // Limiting side — unilateral exercises only, and only once a tag says
      // something actually limited you. Easy has no limiting side: nothing
      // did, so there's nothing to ask.
      let sideWrap = null;
      let sideChips = null;
      function updateSideVisibility() {
        if (!sideWrap) return;
        const showSide = activeTag && activeTag !== 'easy';
        sideWrap.hidden = !showSide;
        if (!showSide) {
          activeSide = null;
          for (const c of sideChips.children) c.classList.remove('selected');
        }
      }
      if (entry.exercise.unilateral) {
        sideWrap = document.createElement('div');
        sideWrap.hidden = true;
        sideWrap.style.marginTop = 'var(--space-3)';
        const sideLabel = document.createElement('p');
        sideLabel.className = 'muted';
        sideLabel.style.margin = '0 0 6px';
        sideLabel.textContent = 'Limiting side';
        sideWrap.appendChild(sideLabel);
        sideChips = document.createElement('div');
        sideChips.className = 'chips';
        for (const side of [{ value: 'left', label: 'Left' }, { value: 'right', label: 'Right' }, { value: 'even', label: 'Even' }]) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = side.label;
          chip.addEventListener('click', () => {
            activeSide = activeSide === side.value ? null : side.value;
            for (const c of sideChips.children) c.classList.remove('selected');
            if (activeSide) chip.classList.add('selected');
          });
          sideChips.appendChild(chip);
        }
        sideWrap.appendChild(sideChips);
        block.appendChild(sideWrap);
      }

      const logBtn = document.createElement('button');
      logBtn.type = 'button';
      logBtn.textContent = 'Log set';
      logBtn.style.marginTop = 'var(--space-3)';
      block.appendChild(logBtn);

      const localStatus = document.createElement('div');
      localStatus.className = 'status';
      localStatus.hidden = true;
      localStatus.setAttribute('role', 'status');
      block.appendChild(localStatus);

      // With sets logged, this just closes the card. With none, there's
      // nothing here worth keeping open for — it doubles as a way to drop
      // an exercise added by mistake, immediately rather than waiting for
      // it to get silently dropped at the end of the workout (see endConfirm).
      const finishBtn = document.createElement('button');
      finishBtn.type = 'button';
      finishBtn.className = 'secondary';
      finishBtn.textContent = entry.sets.length === 0 ? 'Discard exercise' : 'Finish exercise';
      finishBtn.style.marginTop = 'var(--space-3)';
      block.appendChild(finishBtn);

      finishBtn.addEventListener('click', () => {
        if (entry.sets.length === 0) {
          removeEmptyExercise(entry);
          return;
        }
        entry.expanded = false;
        renderEntries();
      });

      logBtn.addEventListener('click', async () => {
        hide(localStatus);

        const payload = { session_id: session.id, exercise_id: entry.exercise.id };

        if (type === 'time_based') {
          const secs = parseInt(durationInput.value.trim(), 10);
          if (!Number.isFinite(secs) || secs <= 0) {
            show(localStatus, 'error', 'Enter a duration in seconds.');
            durationInput.focus();
            return;
          }
          payload.duration_seconds = secs;
        } else if (type === 'bodyweight') {
          const reps = parseInt(repsInput.value.trim(), 10);
          if (!Number.isFinite(reps) || reps <= 0) {
            show(localStatus, 'error', 'Enter how many reps you did.');
            repsInput.focus();
            return;
          }
          if (latestBodyweightKg === null) {
            show(localStatus, 'error', 'Still loading your bodyweight — try again in a moment.');
            return;
          }

          const direction = bwMode.getDirection();
          let magnitude = 0;
          if (direction !== 'none') {
            const raw = bwMode.magnitudeInput.value.trim().replace(',', '.');
            magnitude = raw === '' ? 0 : parseFloat(raw);
            if (!Number.isFinite(magnitude) || magnitude < 0) {
              show(localStatus, 'error', 'Enter a number, 0 or more.');
              bwMode.magnitudeInput.focus();
              return;
            }
          }

          payload.weight = magnitude;
          payload.weight_direction = magnitude === 0 ? null : direction;
          payload.bodyweight_kg = latestBodyweightKg;
          payload.reps = reps;
        } else {
          const rawWeight = weightInput.value.trim().replace(',', '.');
          const reps = parseInt(repsInput.value.trim(), 10);

          if (!Number.isFinite(reps) || reps <= 0) {
            show(localStatus, 'error', 'Enter how many reps you did.');
            repsInput.focus();
            return;
          }
          if (rawWeight !== '') {
            const w = parseFloat(rawWeight);
            if (!Number.isFinite(w) || w < 0) {
              show(localStatus, 'error', 'Weight must be a number, 0 or more.');
              weightInput.focus();
              return;
            }
            payload.weight = w;
            // Zero assistance is a real bodyweight rep, not an assisted one —
            // snapshot bodyweight now so it displays and scores as one, the
            // same as the new bodyweight type, without needing to migrate
            // this exercise off its locked legacy type.
            if (type === 'assisted' && w === 0 && latestBodyweightKg !== null) {
              payload.bodyweight_kg = latestBodyweightKg;
            }
          }
          payload.reps = reps;
        }

        if (activeTag) payload.quick_tag = activeTag;
        if (activeSide) payload.limiting_side = activeSide;

        logBtn.disabled = true;
        logBtn.textContent = 'Logging…';

        const { data, error } = await supabase.from('sets').insert(payload).select().single();

        logBtn.disabled = false;
        logBtn.textContent = 'Log set';

        if (error) {
          // Values stay in the fields so the tap can simply be repeated.
          show(localStatus, 'error', describeSetError(error));
          return;
        }

        entry.sets.push(data);
        entry.history.unshift({ ...data, sessions: { id: session.id, start_time: session.start_time } });
        renderEntries();
        flash('Set logged.', 'ok', 1800);
      });

      return block;
    }

    /** Stands in for the whole entry block until a bodyweight is on record to snapshot. */
    function buildBodyweightNudgeBlock(entry) {
      const block = document.createElement('div');
      block.className = 'entry-block';

      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Log your current bodyweight to start logging this exercise.';
      block.appendChild(note);

      const field = document.createElement('div');
      field.className = 'field';
      const label = document.createElement('label');
      label.textContent = 'Your bodyweight (kg)';
      label.htmlFor = `bw-${entry.exercise.id}`;
      field.appendChild(label);
      const input = document.createElement('input');
      input.id = `bw-${entry.exercise.id}`;
      input.type = 'text';
      input.inputMode = 'decimal';
      input.autocomplete = 'off';
      field.appendChild(input);
      block.appendChild(field);

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.textContent = 'Save bodyweight';
      saveBtn.style.marginTop = 'var(--space-3)';
      block.appendChild(saveBtn);

      const status = document.createElement('div');
      status.className = 'status';
      status.hidden = true;
      status.setAttribute('role', 'status');
      block.appendChild(status);

      saveBtn.addEventListener('click', async () => {
        hide(status);
        const raw = input.value.trim().replace(',', '.');
        const w = parseFloat(raw);
        if (!Number.isFinite(w) || w <= 20 || w >= 500) {
          show(status, 'error', 'Enter a realistic bodyweight in kg.');
          input.focus();
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        const { data, error } = await supabase.from('body_weights').insert({ weight_kg: w }).select().single();
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save bodyweight';

        if (error) {
          show(status, 'error', `Could not save: ${error.message}`);
          return;
        }
        latestBodyweightKg = Number(data.weight_kg);
        renderEntries();
        flash('Bodyweight saved.', 'ok', 1800);
      });

      return block;
    }

    // ------------------------------------------------------------------
    // Exercise comment autosave
    // ------------------------------------------------------------------
    function wireCommentAutosave(entry, textarea, stateEl) {
      let timer = null;
      let lastSaved = entry.comment || '';

      const save = async () => {
        const value = textarea.value.trim();
        entry.comment = value;
        if (value === lastSaved) return;

        stateEl.textContent = 'Saving…';
        const { error } = await supabase
          .from('session_exercises')
          .update({ comment: value || null })
          .eq('id', entry.sessionExerciseId);

        if (error) {
          stateEl.textContent = `Not saved — ${error.message}`;
          return;
        }
        lastSaved = value;
        stateEl.textContent = 'Saved';
        setTimeout(() => {
          if (stateEl.textContent === 'Saved') stateEl.textContent = '';
        }, 2000);
      };

      textarea.addEventListener('input', () => {
        entry.comment = textarea.value;
        stateEl.textContent = '';
        clearTimeout(timer);
        timer = setTimeout(save, 800);
      });
      textarea.addEventListener('blur', () => {
        clearTimeout(timer);
        save();
      });
    }

    // ------------------------------------------------------------------
    // Picker: choose or create an exercise
    // ------------------------------------------------------------------
    function openPicker() {
      pickerSearch.value = '';
      newExName.value = '';
      newExType.value = 'weight_reps';
      newExPattern.value = '';
      hide(pickerStatus);
      renderPatternOptions();
      renderPickerList();
      showView('picker');
      pickerSearch.focus();
    }
    addExerciseBtn.addEventListener('click', openPicker);

    pickerBack.addEventListener('click', () => showView('session'));
    pickerSearch.addEventListener('input', renderPickerList);

    function renderPatternOptions() {
      newExPattern.innerHTML = '';
      const none = document.createElement('option');
      none.value = '';
      none.textContent = 'None — uncategorized';
      newExPattern.appendChild(none);
      for (const p of allPatterns) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        newExPattern.appendChild(opt);
      }
    }

    function renderPickerList() {
      const query = pickerSearch.value.trim().toLowerCase();
      const alreadyAdded = new Set(entries.map((e) => e.exercise.id));

      pickerList.innerHTML = '';
      if (query) {
        renderPickerSearchResults(query, alreadyAdded);
      } else {
        renderPickerDefault(alreadyAdded);
      }

      // A prompt, not an auto-opened form — every new search collapses the
      // form back down and asks again rather than assuming you still want
      // to create whatever the previous keystroke suggested.
      pickerCreate.hidden = true;
      const exactExists = allExercises.some(
        (ex) => ex.name.trim().toLowerCase() === query
      );
      if (query && !exactExists) {
        const typed = pickerSearch.value.trim();
        const hasPartialMatches = allExercises.some(
          (ex) => !alreadyAdded.has(ex.id) && ex.name.toLowerCase().includes(query)
        );
        pickerNoMatchText.hidden = hasPartialMatches;
        pickerNoMatchText.textContent = `No exercises match "${typed}".`;
        pickerCreateToggle.hidden = false;
        pickerCreateToggle.textContent = `+ Create "${typed}"`;
        newExName.value = typed;
      } else {
        pickerNoMatchText.hidden = true;
        pickerCreateToggle.hidden = true;
      }
    }

    pickerCreateToggle.addEventListener('click', () => {
      pickerCreateToggle.hidden = true;
      pickerNoMatchText.hidden = true;
      pickerCreate.hidden = false;
    });

    function renderPickerSearchResults(query, alreadyAdded) {
      const matches = allExercises.filter(
        (ex) => !alreadyAdded.has(ex.id) && ex.name.toLowerCase().includes(query)
      );
      appendPickerSection(null, matches);
    }

    /**
     * Before you've typed anything: what you did last time this session type
     * ran, then everything else grouped by movement pattern — patterns tagged
     * for this session type first, then the rest, then anything with no
     * pattern at all.
     */
    function renderPickerDefault(alreadyAdded) {
      const shown = new Set();
      const category = (session.category || '').trim().toLowerCase();

      const lastTime = lastCategoryExercises.filter((ex) => !alreadyAdded.has(ex.id));
      if (lastTime.length > 0) {
        appendPickerSection(`Last ${session.category} session`, lastTime);
        for (const ex of lastTime) shown.add(ex.id);
      }

      const remaining = allExercises.filter((ex) => !alreadyAdded.has(ex.id) && !shown.has(ex.id));

      const byPattern = new Map(); // pattern id -> exercises[]
      const uncategorized = [];
      for (const ex of remaining) {
        if (ex.movement_pattern_id && patternsById.has(ex.movement_pattern_id)) {
          if (!byPattern.has(ex.movement_pattern_id)) byPattern.set(ex.movement_pattern_id, []);
          byPattern.get(ex.movement_pattern_id).push(ex);
        } else {
          uncategorized.push(ex);
        }
      }

      const groups = [...byPattern.entries()].map(([id, exs]) => ({
        pattern: patternsById.get(id),
        exercises: exs.sort((a, b) => a.name.localeCompare(b.name)),
      }));

      // Patterns tagged for this session type sort first; ties broken alphabetically.
      groups.sort((a, b) => {
        const aMatch = category && (a.pattern.category || '').trim().toLowerCase() === category;
        const bMatch = category && (b.pattern.category || '').trim().toLowerCase() === category;
        if (aMatch !== bMatch) return aMatch ? -1 : 1;
        return a.pattern.name.localeCompare(b.pattern.name);
      });

      for (const group of groups) {
        // The pattern name is already the heading, so no need to repeat it
        // as a badge on every row underneath.
        appendPickerSection(group.pattern.name, group.exercises, true);
      }
      if (uncategorized.length > 0) {
        appendPickerSection('Uncategorized', uncategorized.sort((a, b) => a.name.localeCompare(b.name)));
      }

      if (pickerList.children.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty-state';
        p.textContent = 'Every exercise you have is already in this workout.';
        pickerList.appendChild(p);
      }
    }

    function appendPickerSection(label, exercises, hidePatternBadge = false) {
      if (label) {
        const heading = document.createElement('p');
        heading.className = 'section-label';
        heading.textContent = label;
        pickerList.appendChild(heading);
      }
      const ul = document.createElement('ul');
      ul.className = 'list';
      for (const ex of exercises) ul.appendChild(buildPickerRow(ex, hidePatternBadge));
      pickerList.appendChild(ul);
    }

    function buildPickerRow(ex, hidePatternBadge = false) {
      const li = document.createElement('li');
      li.className = 'list-item';
      li.tabIndex = 0;
      li.setAttribute('role', 'button');

      const body = document.createElement('div');
      body.className = 'list-item-body';
      const name = document.createElement('div');
      name.className = 'list-item-name';
      name.textContent = ex.name;
      body.appendChild(name);

      const meta = document.createElement('div');
      meta.className = 'list-item-meta';
      if (!hidePatternBadge) {
        const pattern = ex.movement_pattern_id ? patternsById.get(ex.movement_pattern_id) : null;
        if (pattern) {
          const patBadge = document.createElement('span');
          patBadge.className = 'badge';
          patBadge.textContent = pattern.name;
          meta.appendChild(patBadge);
        }
      }
      body.appendChild(meta);
      li.appendChild(body);

      const chevron = document.createElement('span');
      chevron.className = 'list-item-chevron';
      chevron.innerHTML = '<svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="var(--text)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L11 11 L3 19"/></svg>';
      li.appendChild(chevron);

      const pick = () => addExerciseToSession(ex);
      li.addEventListener('click', pick);
      li.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
      });
      return li;
    }

    createExerciseBtn.addEventListener('click', async () => {
      hide(pickerStatus);
      const name = newExName.value.trim();
      if (!name) {
        show(pickerStatus, 'error', 'Enter a name for the new exercise.');
        newExName.focus();
        return;
      }

      createExerciseBtn.disabled = true;
      createExerciseBtn.textContent = 'Creating…';

      const { data, error } = await supabase
        .from('exercises')
        .insert({
          user_id: user.id,
          name,
          type: newExType.value,
          movement_pattern_id: newExPattern.value || null,
        })
        .select()
        .single();

      createExerciseBtn.disabled = false;
      createExerciseBtn.textContent = 'Create & add';

      if (error) {
        show(pickerStatus, 'error', describeExerciseCreateError(error, name));
        return;
      }

      allExercises.push(data);
      allExercises.sort((a, b) => a.name.localeCompare(b.name));
      await addExerciseToSession(data);
    });

    /**
     * Adds an exercise to the session: creates the session_exercises row
     * (which is both the comment holder and the "was part of this workout"
     * record), then loads that exercise's history for the reference lines.
     */
    async function addExerciseToSession(exercise) {
      hide(pickerStatus);
      show(pickerStatus, 'info', `Adding ${exercise.name}…`);

      const { data: se, error: seError } = await supabase
        .from('session_exercises')
        .insert({ session_id: session.id, exercise_id: exercise.id })
        .select()
        .single();

      let sessionExerciseId = se?.id;
      let comment = se?.comment ?? '';

      if (seError) {
        if (seError.code === '23505') {
          // Already added earlier (e.g. a retry after a dropped connection).
          const { data: existing, error: fetchError } = await supabase
            .from('session_exercises')
            .select('*')
            .eq('session_id', session.id)
            .eq('exercise_id', exercise.id)
            .maybeSingle();
          if (fetchError || !existing) {
            show(pickerStatus, 'error', `Could not add ${exercise.name}: ${(fetchError || seError).message}`);
            return;
          }
          sessionExerciseId = existing.id;
          comment = existing.comment ?? '';
        } else {
          show(pickerStatus, 'error', `Could not add ${exercise.name}: ${seError.message}`);
          return;
        }
      }

      const { history, error: historyError } = await loadExerciseHistory(exercise.id);
      if (historyError) {
        // Non-fatal: you can still log sets, you just lose the reference lines.
        flash(`Added, but couldn't load past history: ${historyError.message}`, 'error', 5000);
      }

      const setsThisSession = history
        .filter((s) => s.session_id === session.id)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      for (const e of entries) e.expanded = false;
      entries.push({
        exercise,
        sessionExerciseId,
        comment,
        isExtra: se?.is_extra ?? false,
        sets: setsThisSession,
        history,
        expanded: true,
        commentExpanded: !!comment || !!se?.is_extra,
      });

      hide(pickerStatus);
      renderEntries();
      showView('session');
    }

    async function loadExerciseHistory(exerciseId) {
      const { data, error } = await supabase
        .from('sets')
        .select('*, sessions(id, start_time)')
        .eq('exercise_id', exerciseId)
        .order('created_at', { ascending: false });
      return { history: data || [], error };
    }

    // ------------------------------------------------------------------
    // End session
    // ------------------------------------------------------------------
    sessionCommentToggle.addEventListener('click', () => {
      sessionCommentField.hidden = !sessionCommentField.hidden;
      sessionCommentToggle.textContent = sessionCommentField.hidden ? '+ Add a comment' : '− Hide';
      if (!sessionCommentField.hidden) sessionCommentInput.focus();
    });

    endSessionBtn.addEventListener('click', () => {
      hide(endStatus);
      const existingComment = session.comment || '';
      sessionCommentInput.value = existingComment;
      // Don't hide a comment you already wrote (e.g. you backed out via
      // "Keep going" after typing one, then came back to Finish).
      sessionCommentField.hidden = !existingComment;
      sessionCommentToggle.textContent = existingComment ? '− Hide' : '+ Add a comment';

      // An exercise with no sets logged against it isn't kept — see endConfirm.
      const keptEntries = entries.filter((e) => e.sets.length > 0);
      const totalSets = keptEntries.reduce((sum, e) => sum + e.sets.length, 0);

      endSummaryHeading.textContent = keptEntries.length === 0
        ? 'Nothing logged — finishing will discard this workout.'
        : `${totalSets} ${totalSets === 1 ? 'set' : 'sets'} across ${keptEntries.length} ${keptEntries.length === 1 ? 'exercise' : 'exercises'}.`;

      endSummary.innerHTML = '';
      if (entries.length === 0) {
        const p = document.createElement('p');
        p.className = 'muted';
        p.style.margin = '0';
        p.textContent = 'Nothing was added to this workout.';
        endSummary.appendChild(p);
      } else {
        for (const entry of entries) {
          const row = document.createElement('div');
          row.className = 'summary-row';
          const name = document.createElement('span');
          name.textContent = entry.exercise.name;
          row.appendChild(name);
          const count = document.createElement('span');
          count.className = 'summary-count';
          count.textContent = entry.sets.length === 0
            ? "no sets — won't be saved"
            : describeSetGroup(entry.sets, entry.exercise.type);
          row.appendChild(count);
          endSummary.appendChild(row);
        }
      }

      endConfirm.textContent = keptEntries.length === 0 ? 'Discard workout' : 'Finish';
      showView('end');
    });

    endBack.addEventListener('click', () => showView('session'));
    endCancel.addEventListener('click', () => showView('session'));

    endConfirm.addEventListener('click', async () => {
      hide(endStatus);
      const keptEntries = entries.filter((e) => e.sets.length > 0);
      const droppedEntries = entries.filter((e) => e.sets.length === 0);

      // Nothing real was logged at all — there's nothing worth saving, so the
      // whole session is dropped rather than recorded as a completed workout.
      if (keptEntries.length === 0) {
        endConfirm.disabled = true;
        endConfirm.textContent = 'Discarding…';

        const { error } = await supabase.from('sessions').delete().eq('id', session.id);

        endConfirm.disabled = false;
        endConfirm.textContent = 'Discard workout';

        if (error) {
          show(endStatus, 'error', `Could not discard the workout: ${error.message}`);
          return;
        }

        goToDashboardWithFlash('Nothing was logged, so the workout was discarded.', 'info');
        return;
      }

      endConfirm.disabled = true;
      endConfirm.textContent = 'Finishing…';

      // An exercise you added but never actually logged a set for doesn't
      // get kept — drop its session_exercises row before finishing.
      if (droppedEntries.length > 0) {
        const dropIds = droppedEntries.map((e) => e.sessionExerciseId);
        const { error: dropError } = await supabase.from('session_exercises').delete().in('id', dropIds);
        if (dropError) {
          endConfirm.disabled = false;
          endConfirm.textContent = 'Finish';
          show(endStatus, 'error', `Could not finish the workout: ${dropError.message}`);
