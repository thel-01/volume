          return;
        }
      }

      const comment = sessionCommentInput.value.trim() || null;
      const { error } = await supabase
        .from('sessions')
        .update({ end_time: new Date().toISOString(), comment })
        .eq('id', session.id);

      endConfirm.disabled = false;
      endConfirm.textContent = 'Finish';

      if (error) {
        show(endStatus, 'error', `Could not finish the workout: ${error.message}`);
        return;
      }

      const finishedCategory = session.category;
      const droppedNote = droppedEntries.length > 0
        ? ` (${droppedEntries.length} exercise${droppedEntries.length === 1 ? '' : 's'} with no sets removed)`
        : '';
      goToDashboardWithFlash((finishedCategory ? `${finishedCategory} workout saved.` : 'Workout saved.') + droppedNote, 'ok');
    });

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    async function loadCategories() {
      const { data, error } = await supabase
        .from('session_types')
        .select('name')
        .order('created_at');
      // A load failure here shouldn't block starting a workout — Other still
      // works. It just means the chip row is short until the next reload.
      sessionTypeNames = error ? [] : data.map((row) => row.name);
    }

    /** Rebuilds in-session state after a reload / phone lock. */
    async function restoreSessionEntries() {
      const [seRes, setsRes] = await Promise.all([
        supabase.from('session_exercises')
          .select('*, exercises(*)')
          .eq('session_id', session.id)
          .order('created_at'),
        supabase.from('sets')
          .select('*')
          .eq('session_id', session.id)
          .order('created_at'),
      ]);

      if (seRes.error || setsRes.error) {
        const err = seRes.error || setsRes.error;
        flash(`Could not restore the workout in progress: ${err.message}`, 'error', 6000);
        return;
      }

      const rows = seRes.data.filter((row) => row.exercises);
      const histories = await Promise.all(
        rows.map((row) => loadExerciseHistory(row.exercise_id))
      );

      entries = rows.map((row, i) => ({
        exercise: row.exercises,
        sessionExerciseId: row.id,
        comment: row.comment || '',
        isExtra: row.is_extra || false,
        sets: setsRes.data.filter((s) => s.exercise_id === row.exercise_id),
        history: histories[i].history,
        expanded: false,
        commentExpanded: !!(row.comment && row.comment.trim()) || !!row.is_extra,
      }));
      if (entries.length > 0) entries[entries.length - 1].expanded = true;
    }

    /** Pick up exactly where a phone lock / reload / undo left off. */
    async function resumeSession(row) {
      session = row;
      const [, lastCat] = await Promise.all([
        restoreSessionEntries(),
        loadLastCategoryExercises(session.category),
      ]);
      lastCategoryExercises = lastCat;
      enterSession();
    }

    // ------------------------------------------------------------------
    // Auto-close a session left open (tab closed, forgot to tap "End") —
    // neither page has a background mechanism, so each checks on its own
    // boot. Long enough that no real rest gap ever crosses it.
    // ------------------------------------------------------------------
    const STALE_SESSION_AFTER_MS = 4 * 60 * 60 * 1000;
    // Undo doesn't reset the staleness clock (it just re-nulls end_time — the
    // signal a fresh check is based on, a set's timestamp, hasn't moved) so
    // without this, a reload shortly after Undo (or a hop over from
    // dashboard.html's own Undo) re-detects the same staleness and re-closes
    // it. A short breadcrumb tells the next check "this one was just
    // handled" — same sessionStorage technique already used for volume:flash.
    const RECENTLY_UNDONE_WINDOW_MS = 5 * 60 * 1000;
    function wasRecentlyUndone(sessionId) {
      const raw = sessionStorage.getItem('volume:justUndone');
      if (!raw) return false;
      try {
        const { id, at } = JSON.parse(raw);
        return id === sessionId && Date.now() - at < RECENTLY_UNDONE_WINDOW_MS;
      } catch {
        return false;
      }
    }

    /** Returns true if the session was closed/discarded (caller should not resume it). */
    async function closeIfStale(row) {
      if (wasRecentlyUndone(row.id)) return false;
      const { data: lastSetRows, error: lastSetErr } = await supabase
        .from('sets')
        .select('created_at')
        .eq('session_id', row.id)
        .order('created_at', { ascending: false })
        .limit(1);
      if (lastSetErr) return false; // A nicety, not the point of the page — fail quiet, try again next load.

      const lastSet = lastSetRows && lastSetRows[0];
      const staleSinceIso = lastSet ? lastSet.created_at : row.start_time;
      const isStale = Date.now() - new Date(staleSinceIso).getTime() > STALE_SESSION_AFTER_MS;
      if (!isStale) return false;

      if (!lastSet) {
        const { error } = await supabase.from('sessions').delete().eq('id', row.id);
        if (error) return false;
        flash('Nothing was logged, so the workout was discarded.', 'info');
        return true;
      }

      const { error } = await supabase
        .from('sessions')
        .update({ end_time: lastSet.created_at })
        .eq('id', row.id);
      if (error) return false;

      staleUndoDismiss = showToast(`Workout ended — started ${elapsedSince(row.start_time)} ago`, 'info', {
        detail: 'Looked left open, so we ended it at your last logged set.',
        actionLabel: 'Undo',
        ms: 0,
        onAction: async () => {
          staleUndoDismiss = null;
          // A new workout may have been started since this toast appeared —
          // refuse rather than yank the user out of it back into this one.
          if (session && session.id !== row.id) {
            flash("A new workout has since started — can't undo this.", 'error');
            return;
          }
          const { error: undoErr } = await supabase
            .from('sessions')
            .update({ end_time: null })
            .eq('id', row.id);
          if (undoErr) {
            flash(`Could not undo: ${undoErr.message}`, 'error');
            return;
          }
          sessionStorage.setItem('volume:justUndone', JSON.stringify({ id: row.id, at: Date.now() }));
          await resumeSession(row);
          return 'Undone — still open.';
        },
      });
      return true;
    }

    user = await requireSession('./index.html');

    if (user) {
      const fetchLogBootData = () => Promise.all([
        supabase.from('sessions').select('*')
          .is('deleted_at', null)
          .is('end_time', null)
          .order('start_time', { ascending: false })
          .limit(1)
          .maybeSingle(),
        supabase.from('exercises').select('*').is('deleted_at', null).order('name'),
        supabase.from('movement_patterns').select('*').is('deleted_at', null).order('name'),
      ]);

      let [openSession, exercisesRes, patternsRes] = await fetchLogBootData();

      // A standalone iOS PWA freezes its JS (including the library's own
      // background token refresh) while backgrounded, so the very first
      // query after reopening can hit a stale token. Refresh and retry once
      // before showing an error for something that isn't a real failure.
      if (isAuthError(openSession.error || exercisesRes.error || patternsRes.error)) {
        await supabase.auth.refreshSession();
        [openSession, exercisesRes, patternsRes] = await fetchLogBootData();
      }

      if (exercisesRes.error || patternsRes.error) {
        const err = exercisesRes.error || patternsRes.error;
        show(topStatus, 'error', `Could not load your exercises: ${err.message}`);
      }
      allExercises = exercisesRes.data || [];
      allPatterns = patternsRes.data || [];
      patternsById = new Map(allPatterns.map((p) => [p.id, p]));

      if (openSession.error) {
        show(topStatus, 'error', `Could not check for a workout in progress: ${openSession.error.message}`);
      }

      let resumed = false;
      if (openSession.data) {
        const handled = await closeIfStale(openSession.data);
        if (!handled) {
          await resumeSession(openSession.data);
          flash('Picked up your workout in progress.', 'info', 4000);
          resumed = true;
        }
      }
      if (!resumed) {
        await loadCategories();
        renderCategoryChips();
        showView('start');
      }
    }
  </script>

  <script src="register-sw.js"></script>
</body>
</html>
