<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volume — Trend</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Volume">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
  <style>
    .legend i {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main class="screen">

    <div id="top-status" class="status" role="status" aria-live="polite" hidden></div>

    <div class="page-header">
      <a href="./dashboard.html" class="icon-link" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></a>
      <h1 id="heading">…</h1>
      <span class="icon-link" style="visibility:hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L7 12 L15 19"/></svg></span>
    </div>

    <p id="loading" class="muted">Loading…</p>

    <div id="content" hidden>
      <p class="section-label" id="index-label">Strength index</p>
      <div class="chart-card" id="index-card">
        <svg id="index-chart" viewBox="0 0 340 180" role="img" aria-label="Strength index over time"></svg>
      </div>
      <p id="index-empty" class="empty-state" hidden>Not enough workouts logged yet. Come back later.</p>
      <div id="legend" class="legend" hidden></div>

      <p class="section-label">Top set weight</p>
      <div class="chart-card" id="top-set-card">
        <svg id="chart" viewBox="0 0 340 180" role="img" aria-label="Top set weight over time"></svg>
      </div>
      <p id="top-set-empty" class="empty-state" hidden>Not enough workouts logged yet. Come back later.</p>
    </div>

    <p id="empty-state" class="empty-state" hidden></p>

  </main>

  <script type="module">
    import { supabase, requireSession, isAuthError } from './supabase-client.js';
    import { renderLineChart } from './chart.js';
    import { sessionCapacities, displayDepths, effectiveLoad, effectiveReps, isBodyweightEquivalent } from './strength-index.js';

    // Set 1 is the loudest, deeper sets recede — a monochrome fade, not a
    // hue ramp. Order carries the meaning here, same principle as a single-
    // hue sequential ramp.
    const DEPTH_STYLE = [
      { color: 'var(--chart-depth-1)', width: '2.2' },
      { color: 'var(--chart-depth-2)', width: '1.9' },
      { color: 'var(--chart-depth-3)', width: '1.6' },
      { color: 'var(--chart-depth-4)', width: '1.4' },
    ];

    // ------------------------------------------------------------------
    // Element refs
    // ------------------------------------------------------------------
    const topStatus = document.getElementById('top-status');
    const heading = document.getElementById('heading');
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');
    const emptyState = document.getElementById('empty-state');
    const svg = document.getElementById('chart');
    const topSetCard = document.getElementById('top-set-card');
    const topSetEmpty = document.getElementById('top-set-empty');
    const indexChart = document.getElementById('index-chart');
    const indexCard = document.getElementById('index-card');
    const indexEmpty = document.getElementById('index-empty');
    const indexLabel = document.getElementById('index-label');
    const legend = document.getElementById('legend');

    // ------------------------------------------------------------------
    // Small shared helpers (same shape as the rest of the app)
    // ------------------------------------------------------------------
    const STATUS_ICONS = {
      ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13 L10 19 L20 5"/></svg>',
      error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L22 20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="0.9" fill="var(--danger)" stroke="none"/></svg>',
    };
    function show(el, kind, message) {
      el.className = `status ${kind}`;
      el.innerHTML = STATUS_ICONS[kind] || '';
      el.appendChild(document.createTextNode(message));
      el.hidden = false;
    }
    function formatWeight(value) {
      if (value === null || value === undefined) return '';
      const n = Number(value);
      return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(2)));
    }
    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '';
      const s = Number(seconds);
      if (s < 60) return `${s}s`;
      const mins = Math.floor(s / 60);
      const rest = s % 60;
      return rest === 0 ? `${mins}m` : `${mins}m ${rest}s`;
    }
    function tagLetter(quickTag) {
      if (quickTag === 'easy') return 'e';
      if (quickTag === 'hard') return 'h';
      if (quickTag === 'failure') return 'f';
      return '';
    }
    function describeSet(set, type) {
      if (type === 'time_based') return formatDuration(set.duration_seconds) + tagLetter(set.quick_tag);
      // Zero assistance on a legacy 'assisted' exercise isn't assisted at
      // all — it's a plain bodyweight rep, so it reads as one.
      if (isBodyweightEquivalent(set, type)) return describeBodyweightSet(set);
      const weight = set.weight === null ? null : `${formatWeight(set.weight)} kg`;
      const suffix = type === 'assisted' ? ' assist' : '';
      const parts = [];
      if (weight) parts.push(weight + suffix);
      if (set.reps !== null && set.reps !== undefined) parts.push(`× ${set.reps}${tagLetter(set.quick_tag)}`);
      return parts.join(' ') || '—';
    }
    /** "BW × 12e" / "+10 kg × 8" / "−15 kg × 6f". Real numbers, never the effective-load estimate. */
    function describeBodyweightSet(set) {
      const magnitude = Number(set.weight || 0);
      let prefix;
      if (magnitude === 0) prefix = 'BW';
      else if (set.weight_direction === 'assist') prefix = `−${formatWeight(magnitude)} kg`;
      else prefix = `+${formatWeight(magnitude)} kg`;
      const reps = set.reps !== null && set.reps !== undefined ? ` × ${set.reps}${tagLetter(set.quick_tag)}` : '';
      return prefix + reps;
    }
    function formatFullDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    /** Compact axis label: "Aug 5", or "Aug 5 '25" if it needs disambiguating from the other end. */
    function formatCompactDate(iso, showYear) {
      const d = new Date(iso);
      const base = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return showYear ? `${base} '${String(d.getFullYear()).slice(-2)}` : base;
    }
    // `useMinutes` is decided once per axis (from its max, not each tick) so
    // ticks never mix units — no axis showing "0s" next to "2m".
    function formatAxisValue(value, type, useMinutes, decimals) {
      if (type === 'time_based') {
        return useMinutes ? `${Math.round(value / 60)}m` : `${Math.round(value)}s`;
      }
      // Every tick on this axis shares the same decimal precision, so "80"
      // next to a real "80.5" reads as "80.0" — never implying more or
      // less precision than its neighbors.
      return `${value.toFixed(decimals)} kg`;
    }

    // ------------------------------------------------------------------
    // One point per workout — the heaviest (or longest / least-assisted) set
    // logged in that session, not just the sessions that happened to set an
    // all-time record. This also means a single session's own
    // warm-up-to-top-set climb collapses into one point instead of several,
    // so it never shows up as its own near-vertical segment.
    //
    // Deliberately NOT the same "best" the strength index uses: this ranks by
    // weight then reps, the index ranks by estimated 1RM. Each is right for
    // the question it answers. Reps run through effectiveReps() before
    // comparing, so a failure-tagged set's uncompleted last rep doesn't win.
    // ------------------------------------------------------------------
    function computeSessionBests(sets, type) {
      const bySession = new Map();
      for (const s of sets) {
        if (type === 'time_based') {
          if (s.duration_seconds === null) continue;
        } else {
          if (s.weight === null || s.reps === null) continue;
        }
        if (!bySession.has(s.session_id)) bySession.set(s.session_id, []);
        bySession.get(s.session_id).push(s);
      }

      const points = [];
      for (const sessionSets of bySession.values()) {
        let best = null;
        let bestLoad = null;
        for (const s of sessionSets) {
          if (type === 'time_based') {
            if (!best || s.duration_seconds > best.duration_seconds) best = s;
          } else if (type === 'bodyweight') {
            // Ranked by effective load (bodyweight ± delta), not the raw
            // delta magnitude — otherwise assisted and added-weight sets
            // would compare on the wrong number entirely. Reps run through
            // effectiveReps() so a failed last rep doesn't win the tiebreak.
            const load = effectiveLoad(s, type);
            if (load === null) continue;
            const better = !best || load > bestLoad
              || (load === bestLoad && effectiveReps(s.reps, s.quick_tag) > effectiveReps(best.reps, best.quick_tag));
            if (better) { best = s; bestLoad = load; }
          } else {
            const w = Number(s.weight);
            const better = !best
              || (type === 'assisted' ? w < Number(best.weight) : w > Number(best.weight))
              || (w === Number(best.weight) && effectiveReps(s.reps, s.quick_tag) > effectiveReps(best.reps, best.quick_tag));
            if (better) best = s;
          }
        }
        if (!best) continue;
        const value = type === 'time_based' ? best.duration_seconds
          : type === 'bodyweight' ? bestLoad
          : Number(best.weight);
        points.push({ date: best.sessions.start_time, value, set: best });
      }

      points.sort((a, b) => new Date(a.date) - new Date(b.date));
      return points;
    }

    // ------------------------------------------------------------------
    // Drawing
    // ------------------------------------------------------------------
    /**
     * One line per set: your top set, then what you held for two sets, three,
     * and so on — all indexed so the first session's top set is 100.
     *
     * Everything is scaled against that ONE baseline rather than each line
     * against its own, so the later sets start below 100 and visibly climb to
     * meet set 1 as their reps come up. Then the whole fan steps up together
     * when the weight finally goes up. Indexing each line separately would
     * start them all at 100 and throw that story away.
     *
     * The underlying number is an estimated 1RM, but that never surfaces —
     * it's a backend detail, not something to think in.
     */
    function drawIndex(points, depths, type) {
      const base = points[0].caps[0];
      if (!(base > 0)) return;

      const series = [];
      for (let k = depths; k >= 1; k--) { // deepest first, so set 1 draws on top
        const pts = points
          .filter((p) => p.caps.length >= k)
          .map((p) => ({ date: p.date, value: (p.caps[k - 1] / base) * 100, session: p, depth: k }));
        if (pts.length === 0) continue;
        const style = DEPTH_STYLE[Math.min(k, DEPTH_STYLE.length) - 1];
        series.push({ key: `c${k}`, points: pts, dots: true, tappable: true, ...style });
      }

      renderLineChart(indexChart, {
        series,
        formatValue: (v) => String(Math.round(v)),
        formatDate: formatCompactDate,
        // Pinned to a 100 baseline like the composite index — without a
        // floor a couple of quiet sessions' 1-2 point drift would fill the
        // whole chart like a real move.
        minRange: 8,
        tooltipLines: (p) => [
          `Set ${p.depth}: ${describeSet(p.session.sets[p.depth - 1], type)}`,
          `${p.value.toFixed(0)} · ${formatFullDate(p.date)}`,
        ],
        ariaLabel: (p) => `Set ${p.depth}, index ${p.value.toFixed(0)} on ${formatFullDate(p.date)}`,
      });

      legend.innerHTML = '';
      for (let k = 1; k <= depths; k++) {
        const style = DEPTH_STYLE[Math.min(k, DEPTH_STYLE.length) - 1];
        const item = document.createElement('span');
        const swatch = document.createElement('i');
        swatch.style.background = style.color;
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(`Set ${k}`));
        legend.appendChild(item);
      }
      legend.hidden = depths < 2;
    }

    /** Drawn for every type alongside the index (when there is one) — the literal top set/effort per session, never just the estimate. */
    function drawTopSet(points, type) {
      const maxValue = Math.max(...points.map((p) => p.value));
      const useMinutes = type === 'time_based' && maxValue >= 60;
      // 'bodyweight' sits on a roughly-body-weight kg scale (whether or not
      // there's added/assisted weight), so an absolute floor matches the
      // bodyweight charts. weight_reps/assisted/time_based have no fixed
      // scale — a 5kg curl and a 200kg deadlift need very different floors
      // — so those scale with the series' own max instead.
      const minRange = type === 'bodyweight'
        ? 2
        : type === 'time_based'
          ? Math.max(5, maxValue * 0.08)
          : Math.max(2, maxValue * 0.05);
      renderLineChart(svg, {
        series: [{ points, dots: true, tappable: true }],
        formatValue: (v, decimals) => formatAxisValue(v, type, useMinutes, decimals),
        formatDate: formatCompactDate,
        minRange,
        tooltipLines: (p) => [describeSet(p.set, type), formatFullDate(p.date)],
        ariaLabel: (p) => `${describeSet(p.set, type)} on ${formatFullDate(p.date)}`,
      });
    }

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    async function loadAll(exerciseId) {
      const fetchExerciseTrendData = () => Promise.all([
        supabase.from('exercises').select('*').eq('id', exerciseId).is('deleted_at', null).maybeSingle(),
        supabase.from('sets').select('*, sessions(id, start_time, deleted_at)').eq('exercise_id', exerciseId).order('created_at'),
      ]);

      let [exerciseRes, setsRes] = await fetchExerciseTrendData();

      // A standalone iOS PWA freezes its JS (including the library's own
      // background token refresh) while backgrounded, so the very first
      // query after reopening can hit a stale token. Refresh and retry once
      // before showing an error for something that isn't a real failure.
      if (isAuthError(exerciseRes.error || setsRes.error)) {
        await supabase.auth.refreshSession();
        [exerciseRes, setsRes] = await fetchExerciseTrendData();
      }

      const err = exerciseRes.error || setsRes.error;
      if (err) {
        loading.hidden = true;
        show(topStatus, 'error', `Could not load this exercise: ${err.message}`);
        return;
      }
      if (!exerciseRes.data) {
        loading.hidden = true;
        show(topStatus, 'error', 'Could not find that exercise. It may have been deleted.');
        return;
      }

      const exercise = exerciseRes.data;
      heading.textContent = exercise.name;
      // Long names would otherwise crowd the back arrow on a phone.
      if (exercise.name.length > 22) heading.style.fontSize = '18px';
      document.title = `Volume — ${exercise.name}`;

      const liveSets = setsRes.data.filter((s) => s.sessions && !s.sessions.deleted_at);
      const topSetPoints = computeSessionBests(liveSets, exercise.type);

      loading.hidden = true;

      if (topSetPoints.length === 0) {
        emptyState.textContent = `No sets logged for ${exercise.name} yet.`;
        emptyState.hidden = false;
        return;
      }

      content.hidden = false;

      // The index needs an estimated 1RM, which weight_reps and bodyweight
      // (via effective load) sets carry. Legacy assisted and time-based
      // exercises get the top-set chart alone. Either way, a single workout
      // isn't a trend — the chart needs a second point before it draws.
      const capacity = sessionCapacities(liveSets, [exercise]).get(exercise.id);
      if (capacity && capacity.length >= 2) {
        indexLabel.hidden = false;
        indexCard.hidden = false;
        indexEmpty.hidden = true;
        drawIndex(capacity, displayDepths(capacity), exercise.type);
      } else if (capacity && capacity.length === 1) {
        indexLabel.hidden = false;
        indexCard.hidden = true;
        indexEmpty.hidden = false;
      } else {
        indexLabel.hidden = true;
        indexCard.hidden = true;
        indexEmpty.hidden = true;
      }

      if (topSetPoints.length >= 2) {
        topSetCard.hidden = false;
        topSetEmpty.hidden = true;
        drawTopSet(topSetPoints, exercise.type);
      } else {
        topSetCard.hidden = true;
        topSetEmpty.hidden = false;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const exerciseId = params.get('id');

    const user = await requireSession('./index.html');
    if (user) {
      if (!exerciseId) {
        loading.hidden = true;
        show(topStatus, 'error', 'No exercise specified.');
      } else {
        await loadAll(exerciseId);
      }
    }
  </script>

  <script src="register-sw.js"></script>
</body>
</html>
