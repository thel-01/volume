<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volume — Trend</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Volume">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
  <style>
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 8px 6px;
    }
    .chart-card svg { display: block; width: 100%; height: auto; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i {
      width: 14px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main class="screen">

    <div id="top-status" class="status" role="status" aria-live="polite" hidden></div>

    <div class="page-header">
      <a href="./dashboard.html" class="icon-link" aria-label="Back">←</a>
      <h1 id="heading">…</h1>
      <span class="icon-link" style="visibility:hidden">←</span>
    </div>

    <p id="loading" class="muted">Loading…</p>

    <div id="content" hidden>
      <p class="section-label" id="index-label">Strength index</p>
      <div class="chart-card">
        <svg id="index-chart" viewBox="0 0 340 180" role="img" aria-label="Strength index over time"></svg>
      </div>
      <div id="legend" class="legend" hidden></div>

      <p class="section-label" style="margin-top:24px;">Top set weight</p>
      <div class="chart-card">
        <svg id="chart" viewBox="0 0 340 180" role="img" aria-label="Top set weight over time"></svg>
      </div>
    </div>

    <p id="empty-state" class="empty-state" hidden></p>

  </main>

  <script type="module">
    import { supabase, requireSession } from './supabase-client.js';
    import { renderLineChart } from './chart.js';
    import { sessionCapacities, displayDepths } from './strength-index.js';

    // Set 1 is the loudest, deeper sets recede — they are context for it, not
    // competing series.
    const DEPTH_STYLE = [
      { color: 'var(--accent)', width: '2.2' },
      { color: '#e0805a', width: '1.9' },
      { color: '#9aa6b8', width: '1.6' },
      { color: '#6c7788', width: '1.4' },
    ];

    // ------------------------------------------------------------------
    // Element refs
    // ------------------------------------------------------------------
    const topStatus = document.getElementById('top-status');
    const heading = document.getElementById('heading');
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');
    const emptyState = document.getElementById('empty-state');
    const svg = document.getElementById('chart');
    const indexChart = document.getElementById('index-chart');
    const indexLabel = document.getElementById('index-label');
    const legend = document.getElementById('legend');

    // ------------------------------------------------------------------
    // Small shared helpers (same shape as the rest of the app)
    // ------------------------------------------------------------------
    function show(el, kind, message) {
      el.className = `status ${kind}`;
      el.textContent = message;
      el.hidden = false;
    }
    function formatWeight(value) {
      if (value === null || value === undefined) return '';
      const n = Number(value);
      return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(2)));
    }
    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return '';
      const s = Number(seconds);
      if (s < 60) return `${s}s`;
      const mins = Math.floor(s / 60);
      const rest = s % 60;
      return rest === 0 ? `${mins}m` : `${mins}m ${rest}s`;
    }
    function tagLetter(quickTag) {
      if (quickTag === 'easy') return 'e';
      if (quickTag === 'hard') return 'h';
      if (quickTag === 'failure') return 'f';
      return '';
    }
    function describeSet(set, type) {
      if (type === 'time_based') return formatDuration(set.duration_seconds) + tagLetter(set.quick_tag);
      const weight = set.weight === null ? null : `${formatWeight(set.weight)} kg`;
      const suffix = type === 'assisted' ? ' assist' : '';
      const parts = [];
      if (weight) parts.push(weight + suffix);
      if (set.reps !== null && set.reps !== undefined) parts.push(`× ${set.reps}${tagLetter(set.quick_tag)}`);
      return parts.join(' ') || '—';
    }
    function formatFullDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    /** Compact axis label: "Aug 5", or "Aug 5 '25" if it needs disambiguating from the other end. */
    function formatCompactDate(iso, showYear) {
      const d = new Date(iso);
      const base = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return showYear ? `${base} '${String(d.getFullYear()).slice(-2)}` : base;
    }
    // `useMinutes` is decided once per axis (from its max, not each tick) so
    // ticks never mix units — no axis showing "0s" next to "2m".
    function formatAxisValue(value, type, useMinutes) {
      if (type === 'time_based') {
        return useMinutes ? `${Math.round(value / 60)}m` : `${Math.round(value)}s`;
      }
      return `${Math.round(value)} kg`;
    }

    // ------------------------------------------------------------------
    // One point per workout — the heaviest (or longest / least-assisted) set
    // logged in that session, not just the sessions that happened to set an
    // all-time record. This also means a single session's own
    // warm-up-to-top-set climb collapses into one point instead of several,
    // so it never shows up as its own near-vertical segment.
    //
    // Deliberately NOT the same "best" the strength index uses: this ranks by
    // weight then reps, the index ranks by estimated 1RM. Each is right for
    // the question it answers.
    // ------------------------------------------------------------------
    function computeSessionBests(sets, type) {
      const bySession = new Map();
      for (const s of sets) {
        if (type === 'time_based') {
          if (s.duration_seconds === null) continue;
        } else {
          if (s.weight === null || s.reps === null) continue;
        }
        if (!bySession.has(s.session_id)) bySession.set(s.session_id, []);
        bySession.get(s.session_id).push(s);
      }

      const points = [];
      for (const sessionSets of bySession.values()) {
        let best = null;
        for (const s of sessionSets) {
          if (type === 'time_based') {
            if (!best || s.duration_seconds > best.duration_seconds) best = s;
          } else {
            const w = Number(s.weight);
            const better = !best
              || (type === 'assisted' ? w < Number(best.weight) : w > Number(best.weight))
              || (w === Number(best.weight) && s.reps > best.reps);
            if (better) best = s;
          }
        }
        const value = type === 'time_based' ? best.duration_seconds : Number(best.weight);
        points.push({ date: best.sessions.start_time, value, set: best });
      }

      points.sort((a, b) => new Date(a.date) - new Date(b.date));
      return points;
    }

    // ------------------------------------------------------------------
    // Drawing
    // ------------------------------------------------------------------
    /**
     * One line per set: your top set, then what you held for two sets, three,
     * and so on — all indexed so the first session's top set is 100.
     *
     * Everything is scaled against that ONE baseline rather than each line
     * against its own, so the later sets start below 100 and visibly climb to
     * meet set 1 as their reps come up. Then the whole fan steps up together
     * when the weight finally goes up. Indexing each line separately would
     * start them all at 100 and throw that story away.
     *
     * The underlying number is an estimated 1RM, but that never surfaces —
     * it's a backend detail, not something to think in.
     */
    function drawIndex(points, depths) {
      const base = points[0].caps[0];
      if (!(base > 0)) return;

      const series = [];
      for (let k = depths; k >= 1; k--) { // deepest first, so set 1 draws on top
        const pts = points
          .filter((p) => p.caps.length >= k)
          .map((p) => ({ date: p.date, value: (p.caps[k - 1] / base) * 100, session: p, depth: k }));
        if (pts.length === 0) continue;
        const style = DEPTH_STYLE[Math.min(k, DEPTH_STYLE.length) - 1];
        series.push({ key: `c${k}`, points: pts, dots: true, tappable: true, ...style });
      }

      renderLineChart(indexChart, {
        series,
        formatValue: (v) => String(Math.round(v)),
        formatDate: formatCompactDate,
        tooltipLines: (p) => [
          `Set ${p.depth}: ${describeSet(p.session.sets[p.depth - 1], 'weight_reps')}`,
          `${p.value.toFixed(0)} · ${formatFullDate(p.date)}`,
        ],
        ariaLabel: (p) => `Set ${p.depth}, index ${p.value.toFixed(0)} on ${formatFullDate(p.date)}`,
      });

      legend.innerHTML = '';
      for (let k = 1; k <= depths; k++) {
        const style = DEPTH_STYLE[Math.min(k, DEPTH_STYLE.length) - 1];
        const item = document.createElement('span');
        const swatch = document.createElement('i');
        swatch.style.background = style.color;
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(`Set ${k}`));
        legend.appendChild(item);
      }
      legend.hidden = depths < 2;
    }

    /** Assisted and time-based exercises have no 1RM, so they keep a plain top-set line. */
    function drawTopSet(points, type) {
      const useMinutes = type === 'time_based'
        && Math.max(...points.map((p) => p.value)) >= 60;
      renderLineChart(svg, {
        series: [{ points, dots: true, tappable: true }],
        formatValue: (v) => formatAxisValue(v, type, useMinutes),
        formatDate: formatCompactDate,
        tooltipLines: (p) => [describeSet(p.set, type), formatFullDate(p.date)],
        ariaLabel: (p) => `${describeSet(p.set, type)} on ${formatFullDate(p.date)}`,
      });
    }

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    async function loadAll(exerciseId) {
      const [exerciseRes, setsRes] = await Promise.all([
        supabase.from('exercises').select('*').eq('id', exerciseId).is('deleted_at', null).maybeSingle(),
        supabase.from('sets').select('*, sessions(id, start_time, deleted_at)').eq('exercise_id', exerciseId).order('created_at'),
      ]);

      const err = exerciseRes.error || setsRes.error;
      if (err) {
        loading.hidden = true;
        show(topStatus, 'error', `Could not load this exercise: ${err.message}`);
        return;
      }
      if (!exerciseRes.data) {
        loading.hidden = true;
        show(topStatus, 'error', 'Could not find that exercise. It may have been deleted.');
        return;
      }

      const exercise = exerciseRes.data;
      heading.textContent = exercise.name;
      // Long names would otherwise crowd the back arrow on a phone.
      if (exercise.name.length > 22) heading.style.fontSize = '18px';
      document.title = `Volume — ${exercise.name}`;

      const liveSets = setsRes.data.filter((s) => s.sessions && !s.sessions.deleted_at);
      const topSetPoints = computeSessionBests(liveSets, exercise.type);

      loading.hidden = true;

      if (topSetPoints.length === 0) {
        emptyState.textContent = `No sets logged for ${exercise.name} yet.`;
        emptyState.hidden = false;
        return;
      }

      content.hidden = false;

      // The index needs an estimated 1RM, which only weight × reps sets carry.
      // Assisted and time-based exercises get the weight chart alone.
      const capacity = sessionCapacities(liveSets, [exercise]).get(exercise.id);
      if (capacity && capacity.length > 0) {
        drawIndex(capacity, displayDepths(capacity));
      } else {
        indexLabel.hidden = true;
        indexChart.closest('.chart-card').hidden = true;
      }

      drawTopSet(topSetPoints, exercise.type);
    }

    const params = new URLSearchParams(window.location.search);
    const exerciseId = params.get('id');

    const user = await requireSession('./index.html');
    if (user) {
      if (!exerciseId) {
        loading.hidden = true;
        show(topStatus, 'error', 'No exercise specified.');
      } else {
        await loadAll(exerciseId);
      }
    }
  </script>

  <script src="register-sw.js"></script>
</body>
</html>
