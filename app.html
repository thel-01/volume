<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Volume</title>

  <!-- ---------------------------------------------------------------------
       This used to be the home screen. Everything on it moved to the
       dashboard (which is now the landing page) and to Settings.

       It stays as a forwarder rather than being deleted, because plenty of
       things can still point here long after the change: a cached copy of an
       old page whose back arrow said ./app.html, an installed home-screen
       shortcut, browser history, a bookmark. Deleting the file turns every
       one of those into a 404; forwarding turns them into a shrug.

       No auth check needed — dashboard.html guards itself.
       --------------------------------------------------------------------- -->
  <meta http-equiv="refresh" content="0; url=./dashboard.html">
  <link rel="canonical" href="./dashboard.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <p class="muted">Taking you to Volume…</p>
    <noscript><a href="./dashboard.html" style="color:var(--accent);">Continue to Volume</a></noscript>
  </main>
  <script>window.location.replace('./dashboard.html');</script>
</body>
</html>
