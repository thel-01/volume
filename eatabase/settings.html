<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eatabase">
  <script type="module" src="./page-init.js"></script>
  <title>Eatabase — Settings</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./app.css">
  <script>/* No zooming at all: iOS ignores user-scalable=no, so cancel its pinch gestures too. */
    for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, e => e.preventDefault(), { passive: false });</script>
</head>
<body><main><section class="screen settings-page"><header id="page-header" class="page-header"></header><div id="page-status" class="status" role="status" aria-live="polite">Loading…</div><ul id="settings-menu" class="list"></ul><div id="meal-setting" class="meal-setting"></div><p class="section-label" id="export">Export</p><div class="export-buttons"><button id="export-json" type="button" class="secondary">Export JSON</button><button id="export-csv" type="button" class="secondary">Export CSV</button></div></section></main><div id="toast-layer" aria-live="polite"></div><script type="module" src="./settings.js"></script></body></html>
