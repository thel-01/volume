<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>Eatabase — Analytics</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eatabase">
  <script type="module" src="./page-init.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./home.css">
  <script>/* No zooming at all: iOS ignores user-scalable=no, so cancel its pinch gestures too. */
    for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, e => e.preventDefault(), { passive: false });</script>
</head>
<body>
  <main>
    <section class="screen">
      <header id="page-header" class="page-header"></header>
      <div id="analytics-status" class="status info" role="status" aria-live="polite">Loading…</div>
      <div id="nutrient-charts" hidden></div>
    </section>
  </main>
  <noscript><p class="empty-state">Turn on JavaScript to see your analytics.</p></noscript>
  <script type="module" src="./analytics.js"></script>
</body>
</html>
